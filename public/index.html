<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171227">
  <title>王宮の密命 Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main>
    <header class="brand">
      <div class="crest">♛</div>
      <div><p class="eyebrow">ONLINE CARD GAME</p><h1>王宮の密命</h1></div>
      <button id="rulesButton" class="ghost compact">遊び方</button>
    </header>

    <section id="homeView" class="home panel">
      <div class="hero-copy">
        <p class="kicker">秘密を読み、最後まで生き残れ。</p>
        <h2>一枚の手札が<br><em>運命を変える。</em></h2>
        <p>2〜5人で遊べる、短く濃密なオンライン対戦。友達にルームコードを送るだけで始められます。</p>
      </div>
      <div class="entry-card">
        <label>あなたの名前<input id="nameInput" maxlength="16" autocomplete="nickname" placeholder="例：アキラ"></label>
        <div class="entry-grid">
          <button id="createButton" class="primary">新しいルームを作る</button>
          <div class="divider"><span>または</span></div>
          <label>ルームコード<input id="codeInput" maxlength="5" autocapitalize="characters" placeholder="ABCDE"></label>
          <button id="joinButton" class="secondary">コードで参加</button>
        </div>
        <p id="homeError" class="error" role="alert"></p>
      </div>
    </section>

    <section id="gameView" class="game hidden">
      <div class="roombar panel">
        <div><span class="label">ROOM</span><button id="copyCode" class="room-code" title="コピー"></button></div>
        <div class="status-center"><span id="phaseBadge" class="badge"></span><strong id="turnStatus"></strong></div>
        <div class="deck"><span class="label">山札</span><strong id="deckCount">—</strong><button id="leaveButton" class="leave">退出</button></div>
      </div>

      <div class="layout">
        <section class="table-zone">
          <div id="players" class="players"></div>
          <div id="actionPanel" class="action-panel panel"></div>
          <div id="handArea" class="hand-area"></div>
        </section>
        <aside class="log-zone panel">
          <div class="tabs"><button class="tab active" data-tab="public">公開ログ</button><button class="tab" data-tab="private">秘密メモ</button></div>
          <div id="publicLog" class="log-list"></div>
          <div id="privateLog" class="log-list hidden"></div>
        </aside>
      </div>
    </section>
  </main>

  <dialog id="rulesDialog">
    <button id="closeRules" class="dialog-close" aria-label="閉じる">×</button>
    <p class="eyebrow">HOW TO PLAY</p><h2>遊び方</h2>
    <p>手番に1枚引き、2枚のうち1枚を公開して効果を使います。最後の生存者、または山札切れ時に最大の手札を持つ人が1点。規定点を先取すると勝利です。</p>
    <div id="cardGuide" class="card-guide"></div>
  </dialog>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
